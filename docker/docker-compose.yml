services:
  postgres:
    image: postgres:15
    container_name: kpt-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kpt

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: always

    networks:
      - cloud-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: cloud-intensive-backend

    env_file:
      - ../.env

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    restart: always

    networks:
      - cloud-network

  nginx:
    image: nginx:latest
    container_name: cloud-intensive-nginx

    depends_on:
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    restart: always

    networks:
      - cloud-network

volumes:
  postgres-data:

networks:
  cloud-network: