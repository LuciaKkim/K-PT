version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cloud-intensive-backend

    env_file:
      - ../.env

    ports:
      - "8080:8080"

    restart: always

    networks:
      - cloud-network

  nginx:
    image: nginx:latest
    container_name: cloud-intensive-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    restart: always

    networks:
      - cloud-network

networks:
  cloud-network: