name: Deploy Backend

on:
  push:
    branches:
      - back

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/cloud-intensive-team4/back

            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/LuciaKkim/K-PT.git

            git fetch origin
            git reset --hard origin/back

            cd docker

            docker compose down
            docker compose up -d --build

            docker image prune -f

            docker ps