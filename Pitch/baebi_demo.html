<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이비 챗봇 연동 데모</title>
<style>
  :root{
    --accent:#2f6fed;
    --accent-dark:#1f52c9;
    --accent-light:#eaf1ff;
    --accent-light2:#dde9ff;
    --ease-smooth: cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background:#eceae2;
  }

  /* ---- 스크롤로 폰이 회전하며 화면이 켜지는 히어로 섹션 ---- */
  .hero-spacer{
    height: 250vh;
    position: relative;
  }
  .hero-sticky{
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    overflow: hidden;
    padding: 0 12px;
  }
  .hero-title{
    margin:0; font-size:15px; font-weight:600; color:#333; letter-spacing:.2px;
    will-change: opacity, transform;
  }
  .stage{
    perspective: 1400px;
  }
  .phone-shell{
    width:340px;
    background:#0d0d0d;
    border-radius:38px;
    padding:12px;
    box-shadow: 0 20px 40px rgba(0,0,0,.18);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .screen{
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    height:700px;
    position:relative;
    opacity:0;
    transition: opacity .05s linear;
  }

  /* ---- Home screen ---- */
  #home{
    display:flex; flex-direction:column; height:100%;
    transition: transform .45s var(--ease-smooth), filter .45s var(--ease-smooth);
    transform-origin:center top;
  }
  #home.dimmed{ transform:scale(.96); filter:brightness(.9); }
  .home-header{
    padding:20px 20px 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .home-header .addr p:first-child{ margin:0; font-size:11px; color:#8a8a8a; }
  .home-header .addr p:last-child{ margin:2px 0 0; font-size:16px; font-weight:600; color:#111; }
  .bell{
    width:34px; height:34px; border-radius:50%; background:#f2f1eb;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .notice-card{
    margin:6px 20px 16px; background:var(--accent-light); border-radius:14px; padding:14px 16px;
  }
  .notice-card p:first-child{ margin:0; font-size:12px; color:var(--accent-dark); }
  .notice-card p:last-child{ margin:4px 0 0; font-size:13.5px; color:#1a2b3c; font-weight:600; }

  .grid{
    padding:0 20px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px;
  }
  .grid-item{ text-align:center; cursor:pointer; transition: transform .2s var(--ease-smooth); }
  .grid-item:active{ transform:scale(.92); }
  .grid-icon{
    width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    margin:0 auto 6px; font-size:22px;
  }
  .grid-item p{ margin:0; font-size:10.5px; color:#333; }

  .fab{
    position:absolute; right:16px; bottom:78px; width:54px; height:54px; border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(47,111,237,.35); cursor:pointer; border:none; z-index:5;
    transition: transform .25s var(--ease-smooth), box-shadow .25s var(--ease-smooth);
  }
  .fab:active{ transform:scale(.9); }
  .fab span{ font-size:24px; }

  .tabbar{
    position:absolute; bottom:0; left:0; right:0; height:58px; background:#fff;
    border-top:0.5px solid #eee; display:flex; align-items:center; justify-content:space-around;
  }
  .tabbar span{ font-size:20px; color:#ccc; transition: color .25s ease; }
  .tabbar span.active{ color:var(--accent); }

  /* ---- Chat overlay ---- */
  #chatOverlay{
    position:absolute; inset:0; background:#f7f8f6; display:flex; flex-direction:column; z-index:10;
    transform: translateY(100%);
    opacity:0;
    pointer-events:none;
    transition: transform .45s var(--ease-smooth), opacity .35s ease;
    border-radius:28px;
  }
  #chatOverlay.open{ transform: translateY(0); opacity:1; pointer-events:auto; }
  .chat-header{
    background:#fff; padding:16px 16px; display:flex; align-items:center; gap:10px;
    border-bottom:0.5px solid #eee;
  }
  .chat-header .back{ font-size:20px; color:#333; cursor:pointer; background:none; border:none; padding:0; transition: transform .2s ease; }
  .chat-header .back:active{ transform:translateX(-3px); }
  .chat-header .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent-light); display:flex;
    align-items:center; justify-content:center; font-size:15px;
  }
  .chat-header .title{ margin:0; font-size:13.5px; font-weight:600; color:#111; }
  .chat-header .sub{ margin:1px 0 0; font-size:10.5px; color:#8a8a8a; }

  .chat-body{
    flex:1; padding:14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;
  }
  .msg{
    max-width:82%; display:flex; flex-direction:column; gap:6px;
    animation: msgIn .35s var(--ease-smooth);
  }
  @keyframes msgIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.bot{ align-self:flex-start; align-items:flex-start; }
  .bubble{
    padding:9px 13px; border-radius:14px; font-size:12.5px; line-height:1.55;
  }
  .msg.user .bubble{ background:var(--accent); color:#fff; border-bottom-right-radius:3px; }
  .msg.bot .bubble{ background:#fff; color:#222; border-bottom-left-radius:3px; }
  .source-chip{
    font-size:10px; color:var(--accent); background:var(--accent-light); padding:3px 8px; border-radius:6px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .action-card{
    background:#fff; border:0.5px solid #e2ded2; border-radius:12px; padding:12px 14px; margin-top:2px;
    width:100%;
  }
  .action-card p{ margin:0 0 8px; font-size:11.5px; color:#555; }
  .action-btn{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:9px 0; font-size:12.5px; font-weight:600; cursor:pointer;
    transition: transform .2s var(--ease-smooth), background .2s ease;
  }
  .action-btn:active{ transform:scale(.97); background:var(--accent-dark); }
  .typing{
    display:flex; gap:4px; padding:10px 13px; background:#fff; border-radius:14px;
    border-bottom-left-radius:3px; width:fit-content;
  }
  .typing span{ width:5px; height:5px; border-radius:50%; background:#aaa; opacity:.4; animation:blink 1.1s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }

  .suggested{ padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .suggested button{
    font-size:10.5px; background:#fff; border:0.5px solid #e2ded2; border-radius:14px;
    padding:6px 11px; color:#555; cursor:pointer;
    transition: transform .2s var(--ease-smooth), background .2s ease, border-color .2s ease;
  }
  .suggested button:active{ transform:scale(.95); background:var(--accent-light); border-color:var(--accent-light2); }
  .chat-input{
    background:#fff; padding:10px; display:flex; gap:8px; border-top:0.5px solid #eee;
  }
  .chat-input input{
    flex:1; background:#f2f2ee; border:none; border-radius:18px; padding:9px 14px; font-size:12px; outline:none;
    transition: background .2s ease;
  }
  .chat-input input:focus{ background:var(--accent-light); }
  .send-btn{
    width:34px; height:34px; border-radius:50%; background:var(--accent); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition: transform .2s var(--ease-smooth);
  }
  .send-btn:active{ transform:scale(.88); }

  /* ---- Feature sub-screen (visitor car / complaint confirmation) ---- */
  #featureOverlay{
    position:absolute; inset:0; background:#fff; display:flex; flex-direction:column; z-index:20;
    transform: translateX(100%);
    opacity:0;
    pointer-events:none;
    transition: transform .4s var(--ease-smooth), opacity .3s ease;
    border-radius:28px;
  }
  #featureOverlay.open{ transform: translateX(0); opacity:1; pointer-events:auto; }
  .feature-header{
    padding:16px; display:flex; align-items:center; gap:10px; border-bottom:0.5px solid #eee;
  }
  .feature-body{ padding:20px; animation: fadeIn .4s var(--ease-smooth); }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .feature-body h3{ font-size:15px; margin:0 0 6px; color:#111; }
  .feature-body p{ font-size:12.5px; color:#777; margin:0 0 20px; }
  .field-row{ margin-bottom:14px; }
  .field-row label{ font-size:11.5px; color:#555; display:block; margin-bottom:6px; }
  .field-row input{
    width:100%; padding:10px 12px; border-radius:10px; border:0.5px solid #ddd; font-size:13px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field-row input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
  .confirm-btn{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:13px 0;
    font-size:13.5px; font-weight:600; margin-top:8px; cursor:pointer;
    transition: transform .2s var(--ease-smooth), background .2s ease;
  }
  .confirm-btn:active{ transform:scale(.97); background:var(--accent-dark); }

  .caption{ text-align:center; font-size:12px; color:#777; margin-top:12px; }
</style>
</head>
<body>

<div class="hero-spacer" id="heroSpacer">
<div class="hero-sticky">
<p class="hero-title" id="heroTitle">📱 스크롤해서 바이비 챗봇을 만나보세요</p>
<div class="stage">
<div class="phone-shell" id="phoneShell">
  <div class="screen" id="screen">

    <!-- HOME -->
    <div id="home">
      <div class="home-header">
        <div class="addr">
          <p>블루빌아파트</p>
          <p>102동 1502호</p>
        </div>
        <div class="bell">🔔</div>
      </div>

      <div class="notice-card">
        <p>공지사항</p>
        <p>8/15(금) 정기 소방점검 안내</p>
      </div>

      <div class="grid">
        <div class="grid-item"><div class="grid-icon" style="background:#eaf1ff;">📢</div><p>공지사항</p></div>
        <div class="grid-item" onclick="openFeature('complaint')"><div class="grid-icon" style="background:#fff1ee;">📝</div><p>민원신청</p></div>
        <div class="grid-item"><div class="grid-icon" style="background:#e8f2ff;">🗳️</div><p>전자투표</p></div>
        <div class="grid-item" onclick="openFeature('visitor')"><div class="grid-icon" style="background:#f5f0ff;">🚗</div><p>방문차량</p></div>
        <div class="grid-item"><div class="grid-icon" style="background:#fff8e5;">🚪</div><p>공동현관</p></div>
        <div class="grid-item"><div class="grid-icon" style="background:#eaf1ff;">🏠</div><p>스마트홈</p></div>
        <div class="grid-item"><div class="grid-icon" style="background:#fdeeee;">🏊</div><p>커뮤니티예약</p></div>
        <div class="grid-item"><div class="grid-icon" style="background:#f1f0e8;">📰</div><p>게시판</p></div>
      </div>

      <button class="fab" onclick="openChat()" aria-label="챗봇 열기"><span>💬</span></button>

      <div class="tabbar">
        <span class="active">🏠</span><span>🏢</span><span>👥</span><span>👤</span>
      </div>
    </div>

    <!-- CHAT OVERLAY -->
    <div id="chatOverlay">
      <div class="chat-header">
        <button class="back" onclick="closeChat()">←</button>
        <div class="avatar">💬</div>
        <div>
          <p class="title">블루빌 생활 도우미</p>
          <p class="sub">규정 질문부터 민원·방문차량까지 도와드려요</p>
        </div>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="msg bot"><div class="bubble">안녕하세요! 관리규약 질문은 물론, 민원신청이나 방문차량 등록도 채팅으로 바로 도와드릴 수 있어요.</div></div>
      </div>
      <div class="suggested" id="suggested">
        <button data-q="방문차량 몇 시간까지 주차 가능해?">방문차량 몇 시간까지 주차 가능해?</button>
        <button data-q="층간소음 민원 넣고 싶어">층간소음 민원 넣고 싶어</button>
        <button data-q="관리비 연체하면 어떻게 돼?">관리비 연체하면 어떻게 돼?</button>
      </div>
      <div class="chat-input">
        <input type="text" id="userInput" placeholder="메시지를 입력하세요">
        <button class="send-btn" id="sendBtn" aria-label="전송">↑</button>
      </div>
    </div>

    <!-- FEATURE SUB-SCREEN -->
    <div id="featureOverlay">
      <div class="feature-header">
        <button class="back" onclick="closeFeature()" style="background:none;border:none;font-size:20px;">←</button>
        <p style="margin:0; font-size:14px; font-weight:600;" id="featureTitle">방문차량 등록</p>
      </div>
      <div class="feature-body" id="featureBody"></div>
    </div>

  </div>
</div>
</div>
<p class="caption">💬 스크롤이 끝나면 버튼으로 챗봇을 시작해보세요</p>
</div>
</div>

<script>
// ---- 가상 지식베이스 ----
const KB = [
  {id:"parking-8-3", cat:"info", kws:["방문","방문차량","몇 시간","시간까지"],
   answer:"방문 차량은 관리사무소에 미리 등록하면 방문자 구역에 최대 4시간까지 주차할 수 있어요.",
   source:"주차 관리 규정 제8조 3항",
   action:{type:"visitor", label:"방문차량 지금 등록하기"}},
  {id:"noise-12-2", cat:"info", kws:["층간소음","민원","소음","시끄러"],
   answer:"층간소음 기준(주간 40dB·야간 35dB)을 초과하는 소음이 지속되면 민원 대상이 돼요. 바로 민원을 접수해드릴까요?",
   source:"층간소음 규정 제12조",
   action:{type:"complaint", label:"민원 지금 접수하기"}},
  {id:"fee-5-2", cat:"info", kws:["관리비","연체","가산금"],
   answer:"관리비를 30일 넘게 연체하면 연 12% 이내 연체가산금이 붙고, 3개월 이상이면 단전·단수 조치까지 가능해요.",
   source:"관리비 규정 제5조 2항", action:null},
  {id:"pet-15-1", cat:"info", kws:["반려동물","강아지","고양이","마리"],
   answer:"반려동물은 세대당 2마리까지 키울 수 있고, 공용공간에서는 목줄과 배변봉투를 반드시 챙겨야 해요.",
   source:"반려동물 사육 규정 제15조", action:null}
];

function retrieve(query){
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(d => {
    let score = 0;
    d.kws.forEach(k => { if(q.includes(k.toLowerCase())) score += 1; });
    if(score > bestScore){ bestScore = score; best = d; }
  });
  return bestScore > 0 ? best : null;
}

// ---- 챗봇 UI ----
const home = document.getElementById("home");
const chatOverlay = document.getElementById("chatOverlay");
const chatBody = document.getElementById("chatBody");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

// ---- 발표용: 스크롤에 따라 폰이 회전하며 화면이 켜지는 효과 ----
const phoneShell = document.getElementById("phoneShell");
const heroSpacer = document.getElementById("heroSpacer");
const heroTitle = document.getElementById("heroTitle");
const screenEl = document.getElementById("screen");

function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

function updateHeroProgress(){
  const scrollable = heroSpacer.offsetHeight - window.innerHeight;
  const rect = heroSpacer.getBoundingClientRect();
  let progress = scrollable > 0 ? (-rect.top) / scrollable : 1;
  progress = clamp(progress, 0, 1);

  // 스크롤 진행도에 따라 폰이 -80deg에서 0deg로 점점 정면을 향해 회전
  const angle = -80 * (1 - progress);
  const scale = 0.72 + 0.28 * progress;
  phoneShell.style.transform = `rotateY(${angle}deg) scale(${scale})`;

  // 회전이 절반 이상 진행되면 화면이 서서히 켜지듯 페이드인
  screenEl.style.opacity = clamp((progress - 0.45) / 0.4, 0, 1);

  // 타이틀 문구는 스크롤 초반에 사라짐
  const titleOpacity = clamp(1 - progress / 0.3, 0, 1);
  heroTitle.style.opacity = titleOpacity;
  heroTitle.style.transform = `translateY(${-12 * (1 - titleOpacity)}px)`;
}

let ticking = false;
function onScroll(){
  if(!ticking){
    requestAnimationFrame(() => { updateHeroProgress(); ticking = false; });
    ticking = true;
  }
}
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", updateHeroProgress);
updateHeroProgress();

function openChat(){
  chatOverlay.classList.add("open");
  home.classList.add("dimmed");
}
function closeChat(){
  chatOverlay.classList.remove("open");
  home.classList.remove("dimmed");
}

function escapeHtml(str){ const d=document.createElement("div"); d.textContent=str; return d.innerHTML; }
function scrollBottom(){ chatBody.scrollTo({ top: chatBody.scrollHeight, behavior:"smooth" }); }

function appendUser(text){
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chatBody.appendChild(div); scrollBottom();
}

function appendTyping(){
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = "typing";
  div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  chatBody.appendChild(div); scrollBottom();
}
function removeTyping(){ const el = document.getElementById("typing"); if(el) el.remove(); }

function appendBot(match){
  const div = document.createElement("div");
  div.className = "msg bot";

  if(!match){
    div.innerHTML = `<div class="bubble">관련 규정을 찾지 못했어요. 조금 더 구체적으로 질문해 주시겠어요?</div>`;
    chatBody.appendChild(div); scrollBottom();
    return;
  }

  let actionHtml = "";
  if(match.action){
    actionHtml = `
      <div class="action-card">
        <p>바로 진행해드릴까요?</p>
        <button class="action-btn" onclick="openFeature('${match.action.type}')">${escapeHtml(match.action.label)}</button>
      </div>`;
  }

  div.innerHTML = `
    <div class="bubble">${escapeHtml(match.answer)}</div>
    <span class="source-chip">📄 ${escapeHtml(match.source)}</span>
    ${actionHtml}
  `;
  chatBody.appendChild(div); scrollBottom();
}

function handleSend(text){
  text = text.trim();
  if(!text) return;
  appendUser(text);
  userInput.value = "";
  sendBtn.disabled = true;
  appendTyping();
  setTimeout(() => {
    removeTyping();
    const match = retrieve(text);
    appendBot(match);
    sendBtn.disabled = false;
  }, 600 + Math.random()*400);
}

sendBtn.addEventListener("click", () => handleSend(userInput.value));
userInput.addEventListener("keydown", e => { if(e.key==="Enter") handleSend(userInput.value); });
document.getElementById("suggested").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(btn) handleSend(btn.dataset.q);
});

// ---- 기능 연동 서브 화면 ----
const featureOverlay = document.getElementById("featureOverlay");
const featureTitle = document.getElementById("featureTitle");
const featureBody = document.getElementById("featureBody");

const FEATURES = {
  visitor: {
    title: "방문차량 등록",
    render: () => `
      <h3>방문차량을 등록해요</h3>
      <p>등록하면 방문자 구역에 최대 4시간까지 주차할 수 있어요.</p>
      <div class="field-row"><label>차량번호</label><input type="text" placeholder="12가 3456"></div>
      <div class="field-row"><label>방문 목적</label><input type="text" placeholder="지인 방문"></div>
      <div class="field-row"><label>예상 방문 시간</label><input type="text" placeholder="오늘 14:00 ~ 18:00"></div>
      <button class="confirm-btn" onclick="submitFeature('방문차량이 등록됐어요.')">등록하기</button>
    `
  },
  complaint: {
    title: "민원 접수",
    render: () => `
      <h3>어떤 민원인가요?</h3>
      <p>접수된 민원은 관리사무소에서 확인 후 순차적으로 처리돼요.</p>
      <div class="field-row"><label>민원 유형</label><input type="text" value="층간소음" readonly></div>
      <div class="field-row"><label>상세 내용</label><input type="text" placeholder="예: 윗집 야간 소음이 반복돼요"></div>
      <button class="confirm-btn" onclick="submitFeature('민원이 접수됐어요. 관리사무소에서 확인 후 연락드려요.')">접수하기</button>
    `
  }
};

function openFeature(type){
  const f = FEATURES[type];
  if(!f) return;
  featureTitle.textContent = f.title;
  featureBody.innerHTML = f.render();
  featureOverlay.classList.add("open");
}
function closeFeature(){
  featureOverlay.classList.remove("open");
}

function submitFeature(message){
  featureBody.innerHTML = `
    <div style="text-align:center; padding-top:40px;">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;">✅</div>
      <h3>완료됐어요</h3>
      <p>${escapeHtml(message)}</p>
      <button class="confirm-btn" style="background:#f2f2ee; color:#333;" onclick="closeFeature(); closeChat();">홈으로</button>
    </div>
  `;
}

window.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (["ArrowLeft","ArrowRight"," ","PageUp","PageDown","Home","End"].includes(e.key)) {
    e.preventDefault();
    parent.postMessage({ type:"deck-key", key: e.key }, "*");
  }
});
</script>
</body>
</html>
